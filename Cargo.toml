[package]
name = "oauth"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
async-trait = "0.1"
tokio = { version = "1.53.1", default-features = false, features = ["rt-multi-thread", "net", "macros", "signal"] }
tonic = "0.12"
tonic-web = "0.12"
prost = "0.13"
tower-http = { version = "0.6", features = ["cors"] }
http = "1"
diesel = { version = "2.1", features = ["postgres"] }
diesel-async = { version = "0.4", features = ["postgres", "bb8"] }
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
argon2 = "0.5"
rand_core = { version = "0.6", features = ["std"] }
jsonwebtoken = "9"
serde = { version = "1", features = ["derive"] }
governor = { version = "0.6", default-features = false, features = ["std", "dashmap"] }

[build-dependencies]
tonic-build = "0.12"
protoc-bin-vendored = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
