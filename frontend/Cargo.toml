[package]
name = "frontend"
version = "0.1.0"
edition = "2024"

[dependencies]
dioxus = { version = "0.7", features = ["web", "router"] }
dioxus-logger = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gloo-net = { version = "0.6", features = ["http"] }
log = "0.4"
web-sys = { version = "0.3", features = ["Window", "Storage", "Location", "Document", "Element", "HtmlElement"] }
wasm-bindgen = "0.2"
dioxus-primitives = { git = "https://github.com/DioxusLabs/components", version = "0.0.1", default-features = false }
dioxus-free-icons = { version = "0.10", features = ["font-awesome-brands", "lucide"] }
