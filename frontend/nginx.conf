# oauth.uz frontend — Dioxus (wasm) SPA.
# Tashqi ingress Caddy: u /api/* ni backendga, qolganini shu yerga yuboradi.
server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Eski nginx mime.types da .wasm bo'lmasligi mumkin — brauzer
    # `application/wasm` bo'lmasa streaming instantiate'ni rad etadi.
    types {
        application/wasm wasm;
    }
    include /etc/nginx/mime.types;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/wasm
        image/svg+xml;

    # dx build chiqishidagi hash'langan fayllar — uzoq keshlanadi.
    # `expires` va `add_header Cache-Control` birga IKKITA sarlavha beradi,
    # shuning uchun faqat bittasi ishlatiladi (gallery'dagi bilan bir xil qoida).
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    location /wasm/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # index.html hech qachon keshlanmaydi — aks holda yangi deploy'dan keyin
    # brauzer eski wasm faylga ishora qiluvchi sahifani ushlab qoladi.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # Dioxus router client-side: /login, /register serverda fayl EMAS.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
